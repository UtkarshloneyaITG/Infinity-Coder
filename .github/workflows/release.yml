name: Build and release VSIX

# Tag a commit to cut a release:  git tag v0.1.0 && git push origin v0.1.0
# Or trigger manually via workflow_dispatch by specifying tag_name.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.1.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The self-checks gate the release: a broken build never ships a .vsix.
      - run: npm test

      - run: npx --yes @vscode/vsce package

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: '*.vsix'
          generate_release_notes: true

